name: Happy Heart Panic Android Port

permissions:
  contents: write

concurrency:
  group: happy-heart-panic-android
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/happy-heart-panic-android.yml'
      - 'happyheart/patch_mobile.py'
      - 'happyheart/prepare.ps1'
      - 'happyheart/inject.ps1'
      - 'happyheart/patch_apk.py'
      - 'happyheart/package.ps1'
      - 'happyheart/sign.ps1'
      - 'happyheart/verify.ps1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare original game and port tools
        shell: pwsh
        run: ./happyheart/prepare.ps1
      - name: Inject tailored touch controls
        shell: pwsh
        run: ./happyheart/inject.ps1
      - name: Build Android package
        shell: pwsh
        run: ./happyheart/package.ps1
      - name: Align and sign APK
        shell: pwsh
        run: ./happyheart/sign.ps1
      - name: Deep verify APK
        shell: pwsh
        run: ./happyheart/verify.ps1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v1
          path: dist/Happy-Heart-Panic-2025-Android-v1.apk
          compression-level: 0
          retention-days: 7
      - name: Upload QA
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-Android-QA
          path: |
            work/original-sha256.txt
            work/version-run.txt
            work/mobile-injection.log
            work/control-verification.txt
            work/aapt-badging.txt
            work/signature.txt
            work/zipalign-check.txt
            work/apk-zip-test.txt
            work/game-droid-compression.txt
            work/final-game-info.txt
            work/final-hash.txt
          retention-days: 30
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: happy-heart-panic-android-v1
          name: Happy Heart Panic 2025 Android v1
          body: |
            Android port built from the supplied GameMaker 2023.8.0.0 VM build.
            Touch layout is based on the game's decompiled input map: movement/jump, interact/OK, light/heavy attack, taunt, dash, items, retry, extra interaction, back, zoom, mute and scene lock.
          files: dist/Happy-Heart-Panic-2025-Android-v1.apk
          overwrite_files: true

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v1
          path: apk
      - name: Android 29 x86 runtime + visual smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_PACKAGE: com.harekuto.happyheartpanic
        with:
          api-level: 29
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r "$(find apk -type f -name '*.apk' -print -quit)"
            adb logcat -c
            adb shell monkey -p "$TEST_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof "$TEST_PACKAGE" | tee smoke-pid.txt
            adb shell dumpsys activity activities | grep "$TEST_PACKAGE" > smoke-activity.txt || true
            adb exec-out screencap -p > hhp-launch.png
            adb logcat -d -v threadtime > smoke-log.txt
            test -s smoke-pid.txt
            test -s hhp-launch.png
            if grep -E -i 'FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime.*FATAL|FATAL ERROR in|Memory allocation failed' smoke-log.txt; then cat smoke-log.txt; exit 1; fi
            echo SMOKE_OK
      - name: Upload runtime QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-Android-runtime-QA
          path: |
            smoke-pid.txt
            smoke-log.txt
            smoke-activity.txt
            hhp-launch.png
          if-no-files-found: ignore
          retention-days: 30
