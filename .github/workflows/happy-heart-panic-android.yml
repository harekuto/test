name: Happy Heart Panic Android Port

permissions:
  contents: write
  actions: read

concurrency:
  group: happy-heart-panic-android
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/happy-heart-panic-android.yml'
      - 'happyheart/patch_mobile.py'
      - 'happyheart/patch_stability.py'
      - 'happyheart/apply_stability.csx'
      - 'happyheart/prepare.ps1'
      - 'happyheart/inject.ps1'
      - 'happyheart/patch_apk.py'
      - 'happyheart/package.ps1'
      - 'happyheart/sign.ps1'
      - 'happyheart/verify.ps1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare original game and port tools
        shell: pwsh
        run: ./happyheart/prepare.ps1

      - name: Inject touch controls and stability fixes
        shell: pwsh
        run: ./happyheart/inject.ps1

      - name: Build Android package
        shell: pwsh
        run: ./happyheart/package.ps1

      - name: Align and sign APK
        shell: pwsh
        run: ./happyheart/sign.ps1

      - name: Deep verify APK
        shell: pwsh
        run: ./happyheart/verify.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v3
          path: dist/Happy-Heart-Panic-2025-Android-v3.apk
          compression-level: 0
          retention-days: 14

      - name: Upload static QA
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-Android-v3-static-QA
          path: |
            work/original-sha256.txt
            work/version-run.txt
            work/mobile-injection.log
            work/stability-dump.log
            work/stability-source-patch.log
            work/stability-import.log
            work/control-verification.txt
            work/sidecar-hashes.txt
            work/verified-sidecar-hashes.txt
            work/aapt-badging.txt
            work/signature.txt
            work/zipalign-check.txt
            work/apk-zip-test.txt
            work/game-droid-compression.txt
            work/final-game-info.txt
            work/final-decompile.log
            work/final-hash.txt
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi

      - uses: actions/download-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v3
          path: apk

      - name: Android 35 x86_64 launch, menu and gameplay smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_PACKAGE: com.harekuto.happyheartpanic
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            test -n "$(find apk -type f -name '*.apk' -print -quit)"
            adb install -r "$(find apk -type f -name '*.apk' -print -quit)"
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell settings put policy_control immersive.full=* || true
            adb logcat -c
            adb shell monkey -p "$TEST_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof "$TEST_PACKAGE" | tee pid-agreement.txt
            test -s pid-agreement.txt
            adb exec-out screencap -p > hhp-agreement.png
            adb shell input keyevent 66
            sleep 12
            adb shell pidof "$TEST_PACKAGE" | tee pid-menu.txt
            test -s pid-menu.txt
            adb exec-out screencap -p > hhp-menu.png
            adb logcat -d -v threadtime > hhp-menu-log.txt
            if grep -E -i 'FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime.*FATAL|FATAL ERROR in|Memory allocation failed|File is not opened for reading|ERROR in[[:space:]]+action number|ANR in com\.harekuto\.happyheartpanic' hhp-menu-log.txt; then cat hhp-menu-log.txt; exit 1; fi
            adb shell input keyevent 66
            sleep 20
            adb shell pidof "$TEST_PACKAGE" | tee pid-gameplay.txt
            test -s pid-gameplay.txt
            adb exec-out screencap -p > hhp-gameplay.png
            adb shell dumpsys activity activities | grep "$TEST_PACKAGE" > hhp-activity.txt || true
            adb logcat -d -v threadtime > hhp-final-log.txt
            if grep -E -i 'FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime.*FATAL|FATAL ERROR in|Memory allocation failed|File is not opened for reading|ERROR in[[:space:]]+action number' hhp-final-log.txt; then cat hhp-final-log.txt; exit 1; fi
            adb shell am force-stop "$TEST_PACKAGE"
            adb shell monkey -p "$TEST_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof "$TEST_PACKAGE" | tee pid-relaunch.txt
            test -s pid-relaunch.txt
            adb exec-out screencap -p > hhp-relaunch.png
            adb logcat -d -v threadtime > hhp-relaunch-log.txt
            if grep -E -i 'FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime.*FATAL|FATAL ERROR in|Memory allocation failed|File is not opened for reading|ERROR in[[:space:]]+action number' hhp-relaunch-log.txt; then cat hhp-relaunch-log.txt; exit 1; fi
            echo HHP_RUNTIME_SMOKE_OK

      - name: Upload runtime QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-Android-v3-runtime-QA
          path: |
            pid-agreement.txt
            pid-menu.txt
            pid-gameplay.txt
            pid-relaunch.txt
            hhp-agreement.png
            hhp-menu.png
            hhp-gameplay.png
            hhp-relaunch.png
            hhp-menu-log.txt
            hhp-final-log.txt
            hhp-relaunch-log.txt
            hhp-activity.txt
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v3
          path: dist
      - name: Publish tested release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: happy-heart-panic-android-v3
          name: Happy Heart Panic 2025 Android v3 - Hardened Port
          body: |
            Fixed Android port based on the supplied GameMaker 2023.8.0.0 VM build.
            
            v3 fixes the startup o_menu crash caused by supporters.txt, preserves required sidecar files, moves agreement.txt to writable GameMaker storage, hardens control/savepoint reads and writes against invalid file handles, and corrects the DLC included-file path for Android.
            
            This release is published only after the Android emulator passes first launch, agreement acceptance, o_menu/main-menu startup, New Game startup, relaunch, screenshot capture, and fatal Logcat checks.
          files: dist/Happy-Heart-Panic-2025-Android-v3.apk
          overwrite_files: true
