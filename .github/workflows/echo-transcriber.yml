name: Echo Transcript Android APK
on:
  push:
    branches:
      - apps/echo-transcriber-20261020
    paths:
      - 'echo-transcriber/**'
      - '.github/workflows/echo-transcriber.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK 35 packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, test, package
        working-directory: echo-transcriber
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK contents
        run: |
          test -s echo-transcriber/app/build/outputs/apk/debug/app-debug.apk
          unzip -t echo-transcriber/app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum echo-transcriber/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EchoTranscript-debug-APK
          path: echo-transcriber/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
