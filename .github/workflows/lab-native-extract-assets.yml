name: Extract LAB ACTKOOL Native Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-native-extract-assets.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install extraction tools
        run: |
          set -eux
          python3 -m pip install --upgrade gdown pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file
      - name: Download original LAB archive
        run: |
          set -eux
          mkdir -p work/game work/assets
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-704c-8246-b9cd-d842e1bdbdd2/raw?se=2026-09-22T18%3A34%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=fb61953d-578b-5312-88c2-c4a88ce91653&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T17%3A06%3A57Z&ske=2026-09-23T17%3A06%3A57Z&sks=b&skv=2026-02-06&sig=t%2BzUAsEKGkAeK0enDnokZ0zQyWFowAwKjkMU2IWhU8g%3D' -o work/LAB.rar
          test -s work/LAB.rar
          sha256sum work/LAB.rar | tee work/original-sha256.txt
          7z x -y work/LAB.rar -owork/game >/dev/null
          find work/game -maxdepth 3 -type f -printf '%P %s bytes\n' | sort | tee work/game-files.txt
      - name: Build IGMaker extractor
        run: |
          set -eux
          git clone https://github.com/C-Sharper-Repo/IGMaker-Extractor.git work/igextract
          dotnet build work/igextract/IGMaker.Tools.CLI/IGMaker.Tools.CLI.csproj -c Release
          CLI="$(find work/igextract/IGMaker.Tools.CLI/bin/Release -type f -name 'IGMaker.Tools.CLI.dll' -print -quit)"
          test -n "$CLI"
          echo "IG_CLI=$CLI" >> "$GITHUB_ENV"
      - name: Extract ACTKOOL assets
        run: |
          set -eux
          ROOT="$(dirname "$(find work/game -type f -name '*.actbin' -print -quit)")"
          test -n "$ROOT"
          echo "GAME_ROOT=$ROOT" | tee work/game-root.txt
          dotnet "$IG_CLI" -i "$ROOT" -o work/assets -f -s -g -ll 3 -lp work/extractor.log
          find work/assets -type f -printf '%P %s bytes\n' | sort | tee work/asset-files.txt
          echo "PNG_COUNT=$(find work/assets -type f -iname '*.png' | wc -l)" | tee work/counts.txt
          echo "WAV_COUNT=$(find work/assets -type f -iname '*.wav' | wc -l)" | tee -a work/counts.txt
          echo "TOTAL_FILES=$(find work/assets -type f | wc -l)" | tee -a work/counts.txt
          sha256sum $(find work/assets -type f -iname '*.png' | sort | head -20) > work/first-png-sha256.txt || true
      - name: Create texture contact sheet metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          rows=[]
          for p in sorted(Path("work/assets").rglob("*.png")):
              try:
                  with Image.open(p) as im:
                      rows.append({"path":p.as_posix(),"w":im.width,"h":im.height})
              except Exception:
                  pass
          Path("work/texture-metadata.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          print("textures",len(rows))
          PY
        shell: bash
      - name: Package stable extracted asset archive
        run: |
          set -eux
          cd work
          7z a -tzip -mx=1 LAB-ACTKOOL-Native-Assets-v1.zip assets/ original-sha256.txt game-files.txt asset-files.txt counts.txt texture-metadata.json extractor.log
          sha256sum LAB-ACTKOOL-Native-Assets-v1.zip | tee asset-pack-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-ACTKOOL-Native-Assets
          path: |
            work/LAB-ACTKOOL-Native-Assets-v1.zip
            work/original-sha256.txt
            work/game-files.txt
            work/asset-files.txt
            work/counts.txt
            work/texture-metadata.json
            work/extractor.log
            work/asset-pack-sha256.txt
          compression-level: 0
          retention-days: 14

      - name: Publish stable native asset pack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab-actkool-native-assets-v1
          name: LAB Still Alive ACTKOOL Native Assets v1
          body: |
            Extracted native asset pack from the original LAB Still Alive v1.25 ACTKOOL archive.
            Used by the native GameMaker Android reconstruction pipeline.
          files: work/LAB-ACTKOOL-Native-Assets-v1.zip
          overwrite_files: true
