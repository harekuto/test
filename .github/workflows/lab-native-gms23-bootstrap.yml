name: LAB Native GMS2.3.7 Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-native-gms23-bootstrap.yml'
      - 'labnative/create_bootstrap_gms23.csx'
      - 'labnative/smoke_gms23.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: |
          set -eux
          curl -L --fail --retry 3 'https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip' -o utmt.zip
          mkdir utmt
          unzip -q utmt.zip -d utmt
          UTMT="$(find utmt -type f \( -name 'UndertaleModCli' -o -name 'UndertaleModCLI' \) -print -quit)"
          chmod +x "$UTMT"
          echo "UTMT=$UTMT" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/znm2500/GameMaker-Mobiler/main/GMS2%20APK/2.3.7.apk' -o runner.apk

      - name: Build GMS2.3.7 game.droid
        run: |
          set -eux
          "$UTMT" new -o blank.win
          "$UTMT" load blank.win -s labnative/create_bootstrap_gms23.csx -o game.droid -f -v | tee build.txt
          "$UTMT" info game.droid -v | tee game-info.txt
          "$UTMT" dump game.droid -c UMT_DUMP_ALL -o dump >/dev/null
          grep -R -n 'BOOTSTRAP_OK' dump | tee proof.txt
          test -s proof.txt

      - name: Package Android APK
        run: |
          set -eux
          mkdir -p pkg/assets
          cp runner.apk pkg/u.apk
          zip -q -d pkg/u.apk 'META-INF/*' || true
          cp game.droid pkg/assets/game.droid
          (cd pkg && zip -q -0 -u u.apk assets/game.droid)
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 pkg/u.apk pkg/a.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          "$BT/apksigner" sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out LAB-Native-GMS23-Bootstrap.apk pkg/a.apk
          "$BT/apksigner" verify --verbose LAB-Native-GMS23-Bootstrap.apk | tee signature.txt
          "$BT/aapt" dump badging LAB-Native-GMS23-Bootstrap.apk | tee badging.txt
          sed -n "s/package: name='\([^']*\)'.*/\1/p" badging.txt | head -1 > package.txt
          test -s package.txt
          sha256sum LAB-Native-GMS23-Bootstrap.apk | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-Native-GMS23-Bootstrap
          path: |
            LAB-Native-GMS23-Bootstrap.apk
            package.txt
            game.droid
            game-info.txt
            proof.txt
            signature.txt
            sha256.txt
          compression-level: 0
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAB-Native-GMS23-Bootstrap
          path: artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 35 smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash labnative/smoke_gms23.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-Native-GMS23-Runtime-QA
          path: |
            install.txt
            pid.txt
            bootstrap.png
            runtime.log
            runtime-summary.txt
          if-no-files-found: ignore
          retention-days: 30
