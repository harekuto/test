name: Build Conquest Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-conquest-android.yml'
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DRIVE_FILE_ID: 1EYTtiK8oaoy3ZXomkEewS1dykt8iix2s
  DRIVE_URL: https://drive.google.com/file/d/1EYTtiK8oaoy3ZXomkEewS1dykt8iix2s/view?usp=drivesdk
  TEMPLATE_REPO: https://github.com/NEKOBOTMX/rpgmaker-mv-mz-android-studio.git
  TEMPLATE_COMMIT: 9b98ef8345dc3879d3d4426a41ce8b3b743be2d7
  APK_NAME: Conquest-Femdom-Frontlines-Android-port1-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare tools and Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip gdown
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          df -h

      - name: Download user-provided Windows archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/conquest-input"
          ZIP="$RUNNER_TEMP/conquest-input/conquest-windows.zip"
          gdown "$DRIVE_URL" -O "$ZIP"
          test -s "$ZIP"
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, os
          p = Path(os.environ['RUNNER_TEMP'])/'conquest-input'/'conquest-windows.zip'
          print(f'Downloaded bytes: {p.stat().st_size}')
          h=hashlib.sha256()
          with p.open('rb') as f:
              for chunk in iter(lambda:f.read(8*1024*1024), b''):
                  h.update(chunk)
          print('Input SHA256:', h.hexdigest())
          if not zipfile.is_zipfile(p):
              raise SystemExit('Downloaded file is not a valid ZIP')
          with zipfile.ZipFile(p) as z:
              print('ZIP entries:', len(z.infolist()))
              print('ZIP uncompressed bytes:', sum(i.file_size for i in z.infolist()))
          PY

      - name: Extract and inspect RPG Maker project
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/conquest-input/conquest-windows.zip"
          OUT="$RUNNER_TEMP/conquest-extracted"
          mkdir -p "$OUT" port-report
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'conquest-input'/'conquest-windows.zip'
          out=Path(os.environ['RUNNER_TEMP'])/'conquest-extracted'
          with zipfile.ZipFile(src) as z:
              base=out.resolve()
              for info in z.infolist():
                  dest=(out/info.filename).resolve()
                  if dest != base and base not in dest.parents:
                      raise RuntimeError(f'Unsafe ZIP path: {info.filename}')
              z.extractall(out)
          PY
          rm -f "$ZIP"

          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'conquest-extracted'
          report=Path('port-report/inspection.txt')
          candidates=[]
          for idx in root.rglob('index.html'):
              p=idx.parent
              score=0; engine='UNKNOWN'
              if (p/'js'/'rmmz_core.js').exists(): score+=100; engine='RPG Maker MZ'
              if (p/'js'/'rpg_core.js').exists(): score+=100; engine='RPG Maker MV'
              if (p/'data'/'System.json').exists(): score+=20
              if p.name.lower()=='www': score+=10
              candidates.append((score, len(p.parts), engine, p))
          if not candidates:
              raise SystemExit('No index.html found in supplied Windows ZIP')
          candidates.sort(key=lambda x:(-x[0], x[1]))
          score,_,engine,web=candidates[0]
          if score < 100:
              raise SystemExit('Found HTML files but no RPG Maker MV/MZ runtime')
          Path('port-report/webroot.txt').write_text(str(web), encoding='utf-8')

          files=[p for p in web.rglob('*') if p.is_file()]
          total=sum(p.stat().st_size for p in files)
          title='Conquest Femdom Frontlines'
          sysjson=web/'data'/'System.json'
          if sysjson.exists():
              try:
                  data=json.loads(sysjson.read_text(encoding='utf-8-sig'))
                  title=data.get('gameTitle') or data.get('title') or title
              except Exception as e:
                  title += f' (System.json parse warning: {e})'

          declared=[]; enabled=[]
          pf=web/'js'/'plugins.js'
          if pf.exists():
              text=pf.read_text(encoding='utf-8-sig', errors='replace')
              start=text.find('['); end=text.rfind(']')
              if start >= 0 and end > start:
                  try:
                      entries=json.loads(text[start:end+1])
                      declared=[p.get('name','') for p in entries]
                      enabled=[p.get('name','') for p in entries if p.get('status')]
                  except Exception:
                      declared=re.findall(r'"name"\s*:\s*"([^"]+)"', text)
              else:
                  declared=re.findall(r'"name"\s*:\s*"([^"]+)"', text)

          suspicious=[]; suspicious_enabled=[]
          patterns=re.compile(r'\brequire\s*\(|\bprocess\.|\bnw\.|\bgreenworks\b|child_process|\bfs\.(?:read|write|exists|mkdir|unlink|rename)', re.I)
          plugin_dir=web/'js'/'plugins'
          if plugin_dir.exists():
              enabled_set=set(enabled)
              for f in plugin_dir.rglob('*.js'):
                  try: txt=f.read_text(encoding='utf-8', errors='replace')
                  except Exception: continue
                  hits=[]
                  for n,line in enumerate(txt.splitlines(),1):
                      if patterns.search(line):
                          hits.append(f'{f.relative_to(web)}:{n}: {line.strip()[:220]}')
                          if len(hits)>=8: break
                  suspicious.extend(hits)
                  if f.stem in enabled_set:
                      suspicious_enabled.extend(hits)

          encrypted={ext:len(list(web.rglob('*'+ext))) for ext in ['.rpgmvp','.rpgmvo','.rpgmvm','.png_','.ogg_','.m4a_']}
          top_level=sorted([p.name for p in web.iterdir()])
          with report.open('w',encoding='utf-8') as o:
              o.write(f'Engine: {engine}\nChosen web root: {web}\nGame title: {title}\n')
              o.write(f'Web files: {len(files)}\nWeb bytes: {total}\n')
              o.write('Encrypted assets: '+json.dumps(encrypted)+'\n')
              o.write(f'Plugin declarations: {len(declared)}\nEnabled plugins: {len(enabled)}\n')
              o.write('Enabled plugin names:\n'+'\n'.join('  '+x for x in enabled)+'\n')
              o.write(f'Potential desktop/NW.js-only references (all plugins): {len(suspicious)}\n')
              o.write(f'Potential desktop/NW.js-only references (enabled plugins): {len(suspicious_enabled)}\n')
              o.write('\n'.join(suspicious_enabled)+'\n')
              o.write('Top-level project entries:\n'+'\n'.join('  '+x for x in top_level)+'\n')
          print(report.read_text(encoding='utf-8'))
          PY
          df -h

      - name: Prepare pinned Android wrapper and strip Windows NW.js runtime
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$TEMPLATE_REPO" android-port-template
          cd android-port-template
          git checkout --detach "$TEMPLATE_COMMIT"
          rm -rf .git
          cd ..

          WEBROOT="$(cat port-report/webroot.txt)"
          DEST="android-port-template/android/app/src/main/assets/www"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$WEBROOT"/. "$DEST"/

          python - <<'PY'
          from pathlib import Path
          root=Path('android-port-template/android/app/src/main/assets/www')
          exact={
            'Game.exe','nw.exe','nwjc.exe','chromedriver.exe','notification_helper.exe',
            'nw.dll','node.dll','ffmpeg.dll','libEGL.dll','libGLESv2.dll','d3dcompiler_47.dll',
            'resources.pak','icudtl.dat','snapshot_blob.bin','v8_context_snapshot.bin',
            'credits.html','package.json'
          }
          removed=[]
          for name in exact:
              p=root/name
              if p.is_file():
                  removed.append((str(p.relative_to(root)),p.stat().st_size)); p.unlink()
          for dirname in ('locales','swiftshader'):
              p=root/dirname
              if p.is_dir():
                  import shutil
                  size=sum(f.stat().st_size for f in p.rglob('*') if f.is_file())
                  removed.append((dirname+'/',size)); shutil.rmtree(p)
          # Any additional root-only Windows binaries are platform runtime, not RPG Maker content.
          for p in list(root.iterdir()):
              if p.is_file() and p.suffix.lower() in {'.dll','.exe','.pdb'}:
                  removed.append((p.name,p.stat().st_size)); p.unlink()
          with Path('port-report/windows-runtime-removed.txt').open('w',encoding='utf-8') as o:
              for name,size in sorted(removed): o.write(f'{size}\t{name}\n')
              o.write(f'Total removed bytes: {sum(x[1] for x in removed)}\n')
          print(Path('port-report/windows-runtime-removed.txt').read_text())
          PY
          rm -rf "$RUNNER_TEMP/conquest-extracted"

      - name: Configure Android 16 build and app identity
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('android-port-template/android')
          p=root/'build.gradle'
          p.write_text(p.read_text().replace('version "8.7.3"','version "8.10.0"'))
          p=root/'gradle/wrapper/gradle-wrapper.properties'
          p.write_text(re.sub(r'gradle-[^/]+-bin\.zip','gradle-8.11.1-bin.zip',p.read_text()))
          p=root/'app/build.gradle'
          s=p.read_text().replace('compileSdk 35','compileSdk 36')
          s=s.replace('applicationId "com.nekobot.rpgnekos"','applicationId "com.harekuto.conquestfrontlines"')
          s=s.replace('targetSdk 35','targetSdk 36').replace('versionName "1.0.0"','versionName "0.15-android-port1"')
          marker='    compileOptions {'
          insert='''    androidResources {\n        noCompress += ["ogg", "m4a", "mp3", "wav", "mp4", "webm", "rpgmvo", "rpgmvp", "rpgmvm", "png_", "ogg_", "m4a_"]\n    }\n\n'''
          if 'androidResources {' not in s: s=s.replace(marker,insert+marker)
          p.write_text(s)
          p=root/'app/src/main/res/values/strings.xml'
          p.write_text(re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">Conquest Femdom Frontlines</string>',p.read_text()))
          p=root/'app/src/main/AndroidManifest.xml'
          p.write_text(p.read_text().replace('android:allowBackup="false"','android:allowBackup="false"\n        android:largeHeap="true"\n        android:enableOnBackInvokedCallback="false"'))
          p=root/'gradle.properties'
          s=p.read_text()
          if 'org.gradle.jvmargs=' not in s: s+='\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n'
          p.write_text(s)
          PY
          cat android-port-template/android/app/build.gradle
          cat android-port-template/android/app/src/main/AndroidManifest.xml

      - name: Validate packaged game before Gradle
        shell: bash
        run: |
          set -euxo pipefail
          GAME="android-port-template/android/app/src/main/assets/www"
          test -s "$GAME/index.html"
          if [[ -f "$GAME/js/rmmz_core.js" ]]; then
            echo 'Validated RPG Maker MZ runtime'
          elif [[ -f "$GAME/js/rpg_core.js" ]]; then
            echo 'Validated RPG Maker MV runtime'
          else
            echo 'RPG Maker runtime vanished during copy' >&2; exit 1
          fi
          du -sh "$GAME"
          find "$GAME" -type f | wc -l
          python - <<'PY'
          from pathlib import Path
          root=Path('android-port-template/android/app/src/main/assets/www')
          files=sorted(((p.stat().st_size,p) for p in root.rglob('*') if p.is_file()), reverse=True)[:30]
          out=Path('port-report/largest-assets.txt')
          out.write_text(''.join(f'{n} {p}\n' for n,p in files),encoding='utf-8')
          print(out.read_text())
          PY

      - name: Gradle build debug APK
        working-directory: android-port-template/android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain | tee "$GITHUB_WORKSPACE/port-report/gradle-build.log"

      - name: Verify APK structure and metadata
        shell: bash
        run: |
          set -euxo pipefail
          SRC="android-port-template/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          mkdir -p release
          cp "$SRC" "release/$APK_NAME"
          APK="release/$APK_NAME"
          sha256sum "$APK" | tee port-report/apk.sha256
          stat -c 'APK bytes: %s' "$APK" | tee port-report/apk-size.txt
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee port-report/aapt-badging.txt
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          apk=Path('release')/os.environ['APK_NAME']
          with ZipFile(apk) as z:
              names=z.namelist()
              game=[n for n in names if n.startswith('assets/www/') and not n.endswith('/')]
              checks=['assets/www/index.html']
              for x in checks:
                  if x not in names: raise SystemExit(f'APK lacks {x}')
              if not any(n.startswith('classes') and n.endswith('.dex') for n in names): raise SystemExit('APK lacks classes.dex')
              if any(n.endswith(('.dll','.exe')) and n.startswith('assets/www/') for n in names): raise SystemExit('APK still contains Windows binaries in game assets')
              text=f'APK game asset entries: {len(game)}\nAPK total ZIP entries: {len(names)}\n'
              print(text); Path('port-report/apk-inspection.txt').write_text(text,encoding='utf-8')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-Femdom-Frontlines-Android-APK
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload port/build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-Android-port-diagnostics
          path: port-report/
          if-no-files-found: warn
          retention-days: 1
