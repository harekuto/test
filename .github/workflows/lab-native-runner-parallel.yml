name: LAB Native Runner Parallel Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-native-runner-parallel.yml'
      - 'labnative/test_one_runner.sh'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner-version: ['2.2.2','2.3.7','2022.12','2023.6']
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-native-generated-data
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: harekuto/test
          run-id: 35720804330
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test runner ${{ matrix.runner-version }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUNNER_VERSION: ${{ matrix.runner-version }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash labnative/test_one_runner.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-native-runner-${{ matrix.runner-version }}-probe
          path: |
            result.txt
            pid.txt
            runtime.log
            runtime-summary.txt
            crash-summary.txt
            screen.png
            runner-abis.txt
            badging.txt
            install.txt
          if-no-files-found: ignore
          retention-days: 30
