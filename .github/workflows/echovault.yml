name: EchoVault Android APK
on:
  push:
    branches: [echovault-apk-build]
    paths:
      - '.github/workflows/echovault.yml'
      - 'payload/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using hosted runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original EchoVault source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.txt > source.tar.xz.b64
          test "$(wc -c < source.tar.xz.b64)" = 18280
          echo "8051ab27bab1dd965bd6acec5ac4373c38300aedb80a49889ba4bd314bc1c498  source.tar.xz.b64" | sha256sum -c -
          mkdir -p source
          base64 --decode source.tar.xz.b64 | tar -xJ -C source
          test -f source/app/src/main/AndroidManifest.xml
      - name: Inspect restored source and assert core classes
        shell: bash
        run: |
          set -euo pipefail
          find source/app/src/main -type f | sort
          find source/app/src/main/java -name '*.java' -type f -printf '%p %s bytes\\n' | sort
          test -s source/app/src/main/java/com/harekuto/echovault/MainActivity.java
          test -s source/app/src/main/java/com/harekuto/echovault/RecordingService.java
      - name: Test and build Android APK
        run: gradle -p source :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -E '^classes[0-9]*\\.dex
          mkdir -p dist
          cp "$APK" dist/EchoVault-v1.0.0-debug.apk
          sha256sum dist/EchoVault-v1.0.0-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVault-v1.0.0-APK
          path: dist/EchoVault-v1.0.0-debug.apk
          if-no-files-found: error
      - name: Commit APK to separate build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Publish verified EchoVault Android APK [skip ci]" || true
          git push origin HEAD:echovault-apk-build
 | sort -V | tee /tmp/dex_entries
          : > /tmp/echovault-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> /tmp/echovault-dex-strings.txt
          done < /tmp/dex_entries
          grep -F 'MainActivity' /tmp/echovault-dex-strings.txt
          grep -F 'RecordingService' /tmp/echovault-dex-strings.txt
          grep -F 'RecordingFiles' /tmp/echovault-dex-strings.txt
          mkdir -p dist
          cp "$APK" dist/EchoVault-v1.0.0-debug.apk
          sha256sum dist/EchoVault-v1.0.0-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EchoVault-v1.0.0-APK
          path: dist/EchoVault-v1.0.0-debug.apk
          if-no-files-found: error
      - name: Commit APK to separate build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Publish verified EchoVault Android APK [skip ci]" || true
          git push origin HEAD:echovault-apk-build
