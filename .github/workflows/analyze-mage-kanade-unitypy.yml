name: Analyze Mage Kanade Unity Settings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-mage-kanade-unitypy.yml'
      - 'magekanade/unitypy_analyze.py'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis tools
        run: |
          python -m pip install --upgrade gdown UnityPy
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Download and extract exact source
        run: |
          mkdir -p work/game report
          gdown 'https://drive.google.com/uc?id=1QBrS8TcO7KA7eMqRHqcnL2AyeMCQtZ3N' -O work/game.7z
          echo '76503aeaf02387cea3a509dbc881eb06abb1b751376395c5cc6443482770989c  work/game.7z' | sha256sum -c -
          7z x -y work/game.7z -owork/game >/dev/null
      - name: Parse Unity settings
        run: |
          set -o pipefail
          python magekanade/unitypy_analyze.py work/game report | tee report/console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mage-kanade-unitypy-analysis
          path: report/
          retention-days: 14
