name: EchoVault v1.3.0 recording-safety APK
on:
  push:
    branches:
      - echovault-1.3.0-build
    paths:
      - 'echovault-build/**'
      - '.github/workflows/build-echovault-1.3.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'echovault-build/**'
      - '.github/workflows/build-echovault-1.3.yml'
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack source from checked-in archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/echovault-src"
          unzip -q "$GITHUB_WORKSPACE/echovault-build/EchoVault-Android-Source-v1.3.0.zip" -d "$GITHUB_WORKSPACE/echovault-src"
          test -f "$GITHUB_WORKSPACE/echovault-src/app/build.gradle"
          sed -n '1,50p' "$GITHUB_WORKSPACE/echovault-src/app/build.gradle"
      - name: Unit test and build
        working-directory: echovault-src
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: APK integrity checks
        run: |
          APK="$GITHUB_WORKSPACE/echovault-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12
          unzip -t "$APK" | tail -n 2
      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoVault-v1.3.0-debug-APK
          path: echovault-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 10
