name: Assemble Full Corrected APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/assemble-full-corrected-apk.yml' ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '35019988496'
  APK_NAME: Conquest-Femdom-Frontline-0.15-Android-corrected.apk

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Download part 00
        uses: actions/download-artifact@v4
        with:
          name: Conquest-corrected-part-00
          path: parts/00
          github-token: ${{ github.token }}
          repository: harekuto/test
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download part 01
        uses: actions/download-artifact@v4
        with:
          name: Conquest-corrected-part-01
          path: parts/01
          github-token: ${{ github.token }}
          repository: harekuto/test
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download part 02
        uses: actions/download-artifact@v4
        with:
          name: Conquest-corrected-part-02
          path: parts/02
          github-token: ${{ github.token }}
          repository: harekuto/test
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download part 03
        uses: actions/download-artifact@v4
        with:
          name: Conquest-corrected-part-03
          path: parts/03
          github-token: ${{ github.token }}
          repository: harekuto/test
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          name: Conquest-corrected-validation
          path: validation
          github-token: ${{ github.token }}
          repository: harekuto/test
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Assemble and verify exact corrected APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release report
          P0="$(find parts/00 -type f -name 'conquest-corrected.part-00' -print -quit)"
          P1="$(find parts/01 -type f -name 'conquest-corrected.part-01' -print -quit)"
          P2="$(find parts/02 -type f -name 'conquest-corrected.part-02' -print -quit)"
          P3="$(find parts/03 -type f -name 'conquest-corrected.part-03' -print -quit)"
          test -s "$P0" && test -s "$P1" && test -s "$P2" && test -s "$P3"
          cat "$P0" "$P1" "$P2" "$P3" > "release/$APK_NAME"
          ACTUAL="$(sha256sum "release/$APK_NAME" | awk '{print $1}')"
          EXPECTED="$(awk '{print $1}' validation/APK-SHA256.txt)"
          echo "expected=$EXPECTED" | tee report/hash.txt
          echo "actual=$ACTUAL" | tee -a report/hash.txt
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/$APK_NAME" | tee report/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "release/$APK_NAME" | tee report/aapt-badging.txt
          unzip -t "release/$APK_NAME" > report/unzip-test.txt
          stat -c 'APK bytes: %s' "release/$APK_NAME" | tee report/apk-size.txt
      - name: Upload full corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-Femdom-Frontline-0.15-Android-CORRECTED-FULL
          path: release/${{ env.APK_NAME }}
          compression-level: 0
          retention-days: 1
      - name: Upload final verification
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-full-corrected-verification
          path: report/
          retention-days: 1
