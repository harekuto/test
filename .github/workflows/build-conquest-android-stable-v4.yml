name: Build Conquest Android Stable v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-conquest-android-stable-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  DRIVE_URL: https://drive.google.com/file/d/1EYTtiK8oaoy3ZXomkEewS1dykt8iix2s/view?usp=drivesdk
  TEMPLATE_REPO: https://github.com/NEKOBOTMX/rpgmaker-mv-mz-android-studio.git
  TEMPLATE_COMMIT: 9b98ef8345dc3879d3d4426a41ce8b3b743be2d7
  APK_NAME: Conquest-Femdom-Frontline-0.15-Android-stable-v4.apk
  PACKAGE: com.harekuto.conquestfrontline
  RELEASE_TAG: conquest-android-stable-v4

jobs:
  build_release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade gdown
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download and validate original game
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work report release
          gdown "$DRIVE_URL" -O work/game.zip
          test -s work/game.zip
          python -c "import zipfile; assert zipfile.is_zipfile('work/game.zip')"
          sha256sum work/game.zip | tee report/input.sha256

      - name: Prepare hardened Android project
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$TEMPLATE_REPO" wrapper
          cd wrapper
          git checkout --detach "$TEMPLATE_COMMIT"
          rm -rf .git
          cd ..
          python port/extract_rpgmv.py work/game.zip work/extracted wrapper/android/app/src/main/assets/www
          rm -rf work/game.zip work/extracted
          python port/stable_v3_patch_v3.py wrapper/android/app/src/main/assets/www wrapper/android/app/src/main/java/com/nekobot/rpgnekos/MainActivity.java report
          python port/post_hardening_v4.py wrapper/android/app/src/main/assets/www wrapper/android/app/src/main/java/com/nekobot/rpgnekos/MainActivity.java | tee report/v4-hardening.txt
          python port/configure_android_v3.py wrapper/android
          python - <<'PY'
          from xml.etree import ElementTree as ET
          ET.parse('wrapper/android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml parse=PASS')
          PY
          node --check wrapper/android/app/src/main/assets/www/js/rpg_core.js
          node --check wrapper/android/app/src/main/assets/www/js/rpg_managers.js
          node --check wrapper/android/app/src/main/assets/www/js/plugins.js
          test -s wrapper/android/app/src/main/assets/www/img/system/IconSet.png

      - name: Build APK
        working-directory: wrapper/android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain | tee "$GITHUB_WORKSPACE/report/gradle-build.log"

      - name: Verify APK deeply
        shell: bash
        run: |
          set -euxo pipefail
          cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk "release/$APK_NAME"
          APK="release/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee report/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee report/aapt.txt
          sha256sum "$APK" | tee report/apk.sha256
          stat -c 'APK bytes: %s' "$APK" | tee report/apk-size.txt
          unzip -t "$APK" > report/unzip-test.txt
          unzip -l "$APK" | grep -F 'assets/www/img/system/IconSet.png' | tee report/iconset-in-apk.txt
          unzip -p "$APK" assets/www/data/System.json | grep -F '"hasEncryptedImages":false' >/dev/null
          unzip -p "$APK" assets/www/data/System.json | grep -F '"hasEncryptedAudio":false' >/dev/null
          unzip -p "$APK" assets/www/index.html | grep -F "add('ENTER','ok',13,'Enter')" >/dev/null
          unzip -p "$APK" assets/www/index.html | grep -F "add('ESC','escape',27,'Escape')" >/dev/null
          unzip -p "$APK" assets/www/index.html | grep -F 'releaseAndroidPortKeys' >/dev/null
          if unzip -p "$APK" assets/www/index.html | grep -F "process.versions['node-webkit']='0.0.0'"; then echo 'Fake NW.js marker remained' >&2; exit 43; fi
          if unzip -l "$APK" | grep -E '\.(rpgmvp|rpgmvo|rpgmvm)$'; then echo 'Encrypted asset remained in APK' >&2; exit 42; fi
          python - <<'PY'
          import zipfile
          apk='release/Conquest-Femdom-Frontline-0.15-Android-stable-v4.apk'
          with zipfile.ZipFile(apk) as z:
              icon=z.read('assets/www/img/system/IconSet.png')
              assert icon.startswith(b'\x89PNG\r\n\x1a\n')
              names=z.namelist()
              assert not any(n.lower().endswith(('.rpgmvp','.rpgmvo','.rpgmvm')) for n in names)
          print('APK payload validation=PASS')
          PY

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-Android-stable-v4-APK
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title 'Conquest Android Stable v4' --notes 'Android v4: exact Art_Decrypterator3000 conversion for all encrypted assets; canonical IconSet case/path repair; case-sensitive asset audit; no runtime encrypted RPG Maker assets; safer WebView/NW.js compatibility; safer URL routing; stuck-key protection; Android Back=Escape; on-screen ENTER and ESC; largeHeap and hardware acceleration enabled.'
          gh release upload "$RELEASE_TAG" "release/$APK_NAME" --clobber

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Conquest-v4-diagnostics
          path: report/
          if-no-files-found: warn
          retention-days: 7

  smoke_test:
    needs: build_release
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Conquest-Android-stable-v4-APK
          path: release
      - name: Install emulator tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Boot emulator and smoke test
        shell: bash
        run: |
          set -euxo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          sudo chmod 666 /dev/kvm || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n conquest_v4 -k 'system-images;android-35;google_apis;x86_64' --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd conquest_v4 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -partition-size 6144 > emulator.log 2>&1 &
          "$ADB" wait-for-device
          OK=0
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then OK=1; break; fi
            sleep 2
          done
          test "$OK" = 1
          "$ADB" install -r "release/$APK_NAME"
          "$ADB" logcat -c
          "$ADB" shell am force-stop "$PACKAGE"
          "$ADB" shell am start -W -n "$PACKAGE/com.nekobot.rpgnekos.MainActivity"
          sleep 30
          "$ADB" shell pidof "$PACKAGE" | tee pid.txt
          test -s pid.txt
          "$ADB" logcat -d -v threadtime > logcat.txt
          if grep -E 'FATAL EXCEPTION|SIG(SEGV|ABRT)' logcat.txt; then exit 31; fi
          if grep -E 'RPGWEB.*(Loading Error|Failed to load:|Header is wrong|Decryption error|ReferenceError: process is not defined)' logcat.txt; then exit 32; fi
          echo 'runtime_smoke=PASS'
