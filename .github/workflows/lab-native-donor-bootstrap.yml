name: LAB Native GameMaker Donor Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-native-donor-bootstrap.yml'
      - 'labnative/donor_bootstrap.csx'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tools and modern donor
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip openjdk-17-jdk
          mkdir -p work/utmt work/donor work/pkg
          curl -L --fail --retry 3             'https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip'             -o work/utmt.zip
          unzip -q work/utmt.zip -d work/utmt
          UTMT="$(find work/utmt -type f \( -name 'UndertaleModCli' -o -name 'UndertaleModCLI' \) -print -quit)"
          test -n "$UTMT"
          chmod +x "$UTMT"
          echo "UTMT=$UTMT" >> "$GITHUB_ENV"

          curl -L --fail --retry 3             'https://github.com/harekuto/test/releases/download/happy-heart-panic-android-v5/Happy-Heart-Panic-2025-Android-v5.apk'             -o work/donor.apk
          unzip -p work/donor.apk assets/game.droid > work/donor/game.droid
          test -s work/donor/game.droid
          "$UTMT" info work/donor/game.droid -v | tee work/donor-info.txt

      - name: Build LAB-only native bootstrap data
        run: |
          set -eux
          "$UTMT" load work/donor/game.droid -s labnative/donor_bootstrap.csx -o work/game.droid -f -v | tee work/import.txt
          "$UTMT" info work/game.droid -v | tee work/game-info.txt
          rm -rf work/dump
          "$UTMT" dump work/game.droid -c UMT_DUMP_ALL -o work/dump >/dev/null
          grep -R -n 'LAB_BOOTSTRAP_OK' work/dump | tee work/bootstrap-proof.txt
          test -s work/bootstrap-proof.txt

      - name: Repackage signed donor runner with LAB data
        run: |
          set -eux
          cp work/donor.apk work/pkg/u.apk
          zip -q -d work/pkg/u.apk 'META-INF/*' || true
          mkdir -p work/pkg/assets
          cp work/game.droid work/pkg/assets/game.droid
          (
            cd work/pkg
            zip -q -0 -u u.apk assets/game.droid
          )

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/pkg/u.apk work/pkg/a.apk

          keytool -genkeypair -v             -keystore work/pkg/debug.keystore             -storepass android -alias androiddebugkey -keypass android             -dname 'CN=LAB Native Bootstrap,O=Harekuto,C=KZ'             -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1

          "$BUILD_TOOLS/apksigner" sign             --ks work/pkg/debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out work/LAB-Native-Donor-Bootstrap.apk             work/pkg/a.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs work/LAB-Native-Donor-Bootstrap.apk | tee work/signature.txt
          AAPT="$BUILD_TOOLS/aapt"
          "$AAPT" dump badging work/LAB-Native-Donor-Bootstrap.apk | tee work/badging.txt
          PKG="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" work/badging.txt | head -1)"
          test -n "$PKG"
          echo "$PKG" > work/package.txt
          sha256sum work/LAB-Native-Donor-Bootstrap.apk | tee work/apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-Native-Donor-Bootstrap
          path: |
            work/LAB-Native-Donor-Bootstrap.apk
            work/package.txt
            work/game-info.txt
            work/bootstrap-proof.txt
            work/signature.txt
            work/apk-sha256.txt
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAB-Native-Donor-Bootstrap
          path: artifact

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash labnative/donor_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-Native-Donor-Bootstrap-Smoke
          path: |
            donor-smoke-pid.txt
            donor-bootstrap.png
            donor-touch.png
            donor-smoke-log.txt
          if-no-files-found: ignore
          retention-days: 30
