name: SMG Android Final Build
# Trigger revision 4

permissions:
  contents: write

concurrency:
  group: smg-android-final
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smg-android-final.yml'
      - 'scripts/smg_*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare original game and tools
        shell: pwsh
        run: ./scripts/smg_prepare.ps1

      - name: Compile tailored touch controls
        shell: pwsh
        run: ./scripts/smg_inject.ps1

      - name: Build Android package
        shell: pwsh
        run: ./scripts/smg_package.ps1

      - name: Sign Android package
        shell: pwsh
        run: ./scripts/smg_sign.ps1

      - name: Verify final APK
        shell: pwsh
        run: ./scripts/smg_verify.ps1

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Monsters-n-Girls-v2.0.2-Android-v3
          path: dist/Super-Monsters-n-Girls-v2.0.2-Android-v3.apk
          compression-level: 0
          retention-days: 7

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        with:
          name: SMG-Android-QA
          path: |
            work/original-sha256.txt
            work/version-run.txt
            work/mobile-injection.log
            work/control-verification.txt
            work/aapt-badging.txt
            work/signature.txt
            work/zipalign-check.txt
            work/apk-zip-test.txt
            work/final-game-info.txt
            work/final-hash.txt
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smg-android-v3
          name: "Super Monsters'n Girls v2.0.2 Android v3"
          body: |
            Corrected Android v3 port built from the supplied GameMaker 2.2.2.302 VM release.
            Compact 640x480-safe touch layout, migrated saved positions, movement, Z/X/C, Enter and Escape.
          files: dist/Super-Monsters-n-Girls-v2.0.2-Android-v3.apk
          overwrite_files: true


  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Super-Monsters-n-Girls-v2.0.2-Android-v3
          path: apk

      - name: Verify APK artifact exists
        shell: bash
        run: |
          set -euxo pipefail
          find apk -type f -name '*.apk' -printf '%p %s bytes\n'
          test -n "$(find apk -type f -name '*.apk' -print -quit)"

      - name: Android 29 x86 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_PACKAGE: com.harekuto.supermonstersgirls
        with:
          api-level: 29
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r "$(find apk -type f -name '*.apk' -print -quit)"
            adb logcat -c
            adb shell monkey -p "$TEST_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof "$TEST_PACKAGE" | tee smoke-pid.txt
            adb shell dumpsys activity activities | grep "$TEST_PACKAGE" > smoke-activity.txt || true
            adb exec-out screencap -p > smoke-screen.png
            adb logcat -d -v threadtime > smoke-log.txt
            test -s smoke-pid.txt
            test -s smoke-screen.png
            if grep -E -i 'FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime.*FATAL' smoke-log.txt; then cat smoke-log.txt; exit 1; fi
            echo SMOKE_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMG-Android-v3-runtime-smoke
          path: |
            smoke-pid.txt
            smoke-log.txt
            smoke-activity.txt
            smoke-screen.png
          if-no-files-found: ignore
          retention-days: 30
