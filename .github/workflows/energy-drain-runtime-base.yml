name: Build Energy Drain Android Runtime Base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/energy-drain-runtime-base.yml'

permissions:
  contents: read

env:
  TEMPLATE_REPO: https://github.com/NEKOBOTMX/rpgmaker-mv-mz-android-studio.git
  TEMPLATE_COMMIT: 9b98ef8345dc3879d3d4426a41ce8b3b743be2d7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Clone pinned wrapper
        run: |
          git clone --filter=blob:none --no-checkout "$TEMPLATE_REPO" wrapper
          cd wrapper
          git checkout --detach "$TEMPLATE_COMMIT"
          rm -rf .git
      - name: Configure Energy Drain runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('wrapper/android')
          p=root/'build.gradle'
          s=p.read_text()
          s=s.replace('version "8.7.3"','version "8.10.0"')
          p.write_text(s)
          p=root/'gradle/wrapper/gradle-wrapper.properties'
          s=p.read_text()
          s=re.sub(r'gradle-[^/]+-bin\.zip','gradle-8.11.1-bin.zip',s)
          p.write_text(s)
          p=root/'app/build.gradle'
          s=p.read_text()
          s=s.replace('compileSdk 35','compileSdk 36')
          s=s.replace('applicationId "com.nekobot.rpgnekos"','applicationId "com.harekuto.energydrain"')
          s=s.replace('targetSdk 35','targetSdk 36')
          s=s.replace('versionCode 1','versionCode 101')
          s=s.replace('versionName "1.0.0"','versionName "1.0-android-port2"')
          marker='    compileOptions {'
          insert='''    androidResources {\n        noCompress += ["ogg", "m4a", "mp3", "wav", "mp4", "webm", "png", "jpg", "jpeg"]\n    }\n\n'''
          if 'androidResources {' not in s:
              s=s.replace(marker,insert+marker)
          p.write_text(s)
          p=root/'app/src/main/res/values/strings.xml'
          s=p.read_text()
          s=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">Energy Drain</string>',s)
          p.write_text(s)
          p=root/'app/src/main/AndroidManifest.xml'
          s=p.read_text()
          if 'android:largeHeap=' not in s:
              s=s.replace('android:allowBackup="false"','android:allowBackup="false"\n        android:largeHeap="true"')
          if 'android:hardwareAccelerated=' not in s:
              s=s.replace('android:largeHeap="true"','android:largeHeap="true"\n        android:hardwareAccelerated="true"')
          if 'android:enableOnBackInvokedCallback=' not in s:
              s=s.replace('android:hardwareAccelerated="true"','android:hardwareAccelerated="true"\n        android:enableOnBackInvokedCallback="false"')
          p.write_text(s)

          main=root/'app/src/main/java/com/nekobot/rpgnekos/MainActivity.java'
          main.write_text(r'''package com.nekobot.rpgnekos;

import android.annotation.SuppressLint;
import android.app.Activity;
import android.graphics.Color;
import android.net.Uri;
import android.os.Bundle;
import android.util.Log;
import android.view.View;
import android.view.Window;
import android.view.WindowManager;
import android.webkit.ConsoleMessage;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.nio.charset.StandardCharsets;

public class MainActivity extends Activity {
    private static final String TAG = "RPGWEB";
    private static final String GAME_URL = "file:///android_asset/www/index.html";
    private static final String[] PATCH_ASSETS = {
        "patches/nekobot-pixi-texture-patch.js",
        "patches/nekobot-rpgmaker-mz-mobile-patch.js",
        "patches/nekobot-mobile-ogg-audio-patch.js"
    };

    private WebView webView;
    private String runtimePatches;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        requestWindowFeature(Window.FEATURE_NO_TITLE);
        configureWindow();
        runtimePatches = readRuntimePatches();
        webView = new WebView(this);
        webView.setBackgroundColor(Color.BLACK);
        webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
        setContentView(webView);
        configureWebView(webView);
        webView.loadUrl(GAME_URL);
    }

    @SuppressLint("SetJavaScriptEnabled")
    private void configureWebView(WebView view) {
        WebSettings settings = view.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setMediaPlaybackRequiresUserGesture(false);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(false);
        settings.setAllowFileAccessFromFileURLs(true);
        settings.setAllowUniversalAccessFromFileURLs(false);
        settings.setLoadWithOverviewMode(true);
        settings.setUseWideViewPort(true);
        settings.setCacheMode(WebSettings.LOAD_DEFAULT);

        WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);
        view.setWebViewClient(new LocalContentWebViewClient());
        view.setWebChromeClient(new WebChromeClient() {
            @Override
            public boolean onConsoleMessage(ConsoleMessage message) {
                Log.d(TAG, message.message() + " @" + message.sourceId() + ":" + message.lineNumber());
                return true;
            }
        });
    }

    private final class LocalContentWebViewClient extends WebViewClient {
        @Override
        public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
            Uri uri = request.getUrl();
            return !"file".equals(uri.getScheme());
        }

        @Override
        public void onPageFinished(WebView view, String url) {
            super.onPageFinished(view, url);
            Log.i(TAG, "PAGE_FINISHED " + url);
            injectRuntimePatches(view);
        }

        @Override
        public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
            Log.e(TAG, "WEB_ERROR " + request.getUrl() + " " + error);
            super.onReceivedError(view, request, error);
        }
    }

    private void injectRuntimePatches(WebView view) {
        if (runtimePatches == null || runtimePatches.trim().isEmpty()) return;
        view.evaluateJavascript(runtimePatches, null);
    }

    private String readRuntimePatches() {
        StringBuilder builder = new StringBuilder();
        for (String assetPath : PATCH_ASSETS) {
            builder.append(readAsset(assetPath)).append('\n');
        }
        return builder.toString();
    }

    private String readAsset(String assetPath) {
        try (InputStream input = getAssets().open(assetPath);
             BufferedReader reader = new BufferedReader(new InputStreamReader(input, StandardCharsets.UTF_8))) {
            StringBuilder builder = new StringBuilder();
            String line;
            while ((line = reader.readLine()) != null) builder.append(line).append('\n');
            return builder.toString();
        } catch (IOException error) {
            return "";
        }
    }

    private void sendEscapeToGame() {
        if (webView == null) return;
        webView.evaluateJavascript(
            "(function(){try{" +
            "if(window.Input&&Input._onKeyDown){Input._onKeyDown({keyCode:88,preventDefault:function(){}});" +
            "setTimeout(function(){Input._onKeyUp({keyCode:88});},80);return 'ok';}" +
            "}catch(e){console.error(e);}return 'no';})()", null);
    }

    private void configureWindow() {
        getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
        getWindow().getDecorView().setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_FULLSCREEN |
            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
            View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE
        );
    }

    @Override
    public void onBackPressed() {
        sendEscapeToGame();
    }

    @Override
    protected void onResume() {
        super.onResume();
        configureWindow();
        if (webView != null) webView.onResume();
    }

    @Override
    protected void onPause() {
        if (webView != null) webView.onPause();
        super.onPause();
    }

    @Override
    protected void onDestroy() {
        if (webView != null) {
            webView.destroy();
            webView = null;
        }
        super.onDestroy();
    }
}
''', encoding='utf-8')
          www=root/'app/src/main/assets/www'
          import shutil
          shutil.rmtree(www,ignore_errors=True)
          www.mkdir(parents=True)
          (www/'index.html').write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="background:#000;color:#fff;font-family:sans-serif">Energy Drain runtime placeholder</body></html>''')
      - name: Build runtime APK
        working-directory: wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain
      - name: Package runtime and signing tools
        run: |
          mkdir -p out/tools/lib
          cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk out/Energy-Drain-Android-runtime.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/tools/lib/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/Energy-Drain-Android-runtime.apk > out/runtime-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/Energy-Drain-Android-runtime.apk > out/runtime-signature.txt
          sha256sum out/Energy-Drain-Android-runtime.apk > out/runtime.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Energy-Drain-Android-runtime-base
          path: out/
          compression-level: 0
          retention-days: 7
