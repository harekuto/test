name: Mage Kanade Android Port

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mage-kanade-android.yml'
      - 'magekanade/patch_winlator.py'
      - 'magekanade/patch_winlator_package_paths.py'

permissions:
  contents: write

concurrency:
  group: mage-kanade-android
  cancel-in-progress: true

env:
  SOURCE_URL: https://drive.google.com/file/d/1QBrS8TcO7KA7eMqRHqcnL2AyeMCQtZ3N/view?usp=drivesdk
  SOURCE_SIZE: '1035774240'
  SOURCE_SHA256: 76503aeaf02387cea3a509dbc881eb06abb1b751376395c5cc6443482770989c
  WINLATOR_COMMIT: a030f552f452158a2db64fdb32b490fa19c0b48d
  FINAL_APK: Mage-Kanade-Dungeon-Quest-Android-v1.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zip unzip zstd libarchive-tools
          python -m pip install --disable-pip-version-check --no-input gdown

      - name: Download and verify original game
        run: |
          set -euxo pipefail
          mkdir -p work/game
          gdown "$SOURCE_URL" -O work/source.7z
          test "$(stat -c%s work/source.7z)" -eq "$SOURCE_SIZE"
          echo "$SOURCE_SHA256  work/source.7z" | sha256sum -c -
          7z t work/source.7z
          7z x -y work/source.7z -owork/game >/dev/null

          ROOT="$(find work/game -type f -name 'Mage Kanades Futanari Dungeon Quest.exe' -printf '%h\n' -quit)"
          test -n "$ROOT"
          test -f "$ROOT/Mage Kanades Futanari Dungeon Quest.exe"
          test -f "$ROOT/UnityPlayer.dll"
          test -f "$ROOT/GameAssembly.dll"
          test -d "$ROOT/Mage Kanades Futanari Dungeon Quest_Data"
          printf 'GAME_ROOT=%s\n' "$ROOT" >> "$GITHUB_ENV"

      - name: Create exact in-APK game payload
        run: |
          set -euxo pipefail
          mkdir -p work/payload
          cp -a "$GAME_ROOT"/. work/payload/
          (
            cd work/payload
            zip -0 -q -X -r ../mage_payload.zip .
          )
          unzip -t work/mage_payload.zip
          unzip -l work/mage_payload.zip > work/payload-list.txt
          grep -Fq 'Mage Kanades Futanari Dungeon Quest.exe' work/payload-list.txt
          grep -Fq 'UnityPlayer.dll' work/payload-list.txt
          grep -Fq 'GameAssembly.dll' work/payload-list.txt
          grep -Fq 'global-metadata.dat' work/payload-list.txt
          grep -Fq 'StandaloneWindows64/' work/payload-list.txt
          sha256sum work/mage_payload.zip | tee work/payload-sha256.txt
          stat -c 'PAYLOAD_SIZE=%s' work/mage_payload.zip | tee work/payload-size.txt

      - name: Checkout pinned Winlator 11.2
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/brunodev85/winlator-app.git winlator
          cd winlator
          git checkout "$WINLATOR_COMMIT"

      - name: Patch dedicated Mage Kanade launcher
        run: |
          set -euxo pipefail
          python magekanade/patch_winlator.py winlator
          python magekanade/patch_winlator_package_paths.py winlator | tee work/package-path-patch.txt

          test -f winlator/app/src/main/java/com/winlator/MageKanadeBootstrap.java
          test -f winlator/app/src/main/assets/inputcontrols/profiles/controls-99.icp

          mkdir -p winlator/app/src/main/assets
          cp work/mage_payload.zip winlator/app/src/main/assets/mage_payload.zip
          cp work/payload-sha256.txt winlator/app/src/main/assets/mage_payload_sha256.txt

          python - <<'PY'
          from pathlib import Path
          p=Path("winlator/app/build.gradle")
          s=p.read_text()
          anchor="    compileSdk 35\n"
          if anchor not in s:
              raise SystemExit("compileSdk anchor missing")
          if "noCompress += ['zip']" not in s:
              s=s.replace(anchor, anchor+"\n    androidResources {\n        noCompress += ['zip']\n    }\n",1)
          p.write_text(s)
          PY

          grep -n "applicationId 'com.magekana'" winlator/app/build.gradle
          grep -n "noCompress" winlator/app/build.gradle
          grep -n "MageKanadeBootstrap.startWhenReady" winlator/app/src/main/java/com/winlator/MainActivity.java
          grep -n "mage_controls_profile" winlator/app/src/main/java/com/winlator/XServerDisplayActivity.java

      - name: Install Android build dependencies
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;24.0.8215888"             "cmake;3.22.1"

      - name: Build full APK
        working-directory: winlator
        run: |
          set -euxo pipefail
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew --no-daemon clean :app:assembleDebug --stacktrace --console=plain

      - name: Deep verify final APK
        run: |
          set -euxo pipefail
          APK="$(find winlator/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$AAPT" dump badging "$APK" | tee work/apk-badging.txt
          grep -Fq "package: name='com.magekana'" work/apk-badging.txt
          grep -Fq "versionName='1.0-android-port1'" work/apk-badging.txt

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee work/apk-signature.txt
          "$ZIPALIGN" -c -p 4 "$APK" | tee work/apk-zipalign.txt
          unzip -t "$APK" | tee work/apk-zip-test.txt
          unzip -l "$APK" > work/apk-list.txt
          grep -Fq 'assets/mage_payload.zip' work/apk-list.txt
          grep -Fq 'assets/inputcontrols/profiles/controls-99.icp' work/apk-list.txt
          grep -Fq 'lib/arm64-v8a/' work/apk-list.txt

          unzip -p "$APK" assets/mage_payload.zip > work/payload-from-apk.zip
          cmp work/mage_payload.zip work/payload-from-apk.zip
          unzip -t work/payload-from-apk.zip
          unzip -l work/payload-from-apk.zip > work/payload-from-apk-list.txt
          grep -Fq 'Mage Kanades Futanari Dungeon Quest.exe' work/payload-from-apk-list.txt
          grep -Fq 'GameAssembly.dll' work/payload-from-apk-list.txt
          grep -Fq 'UnityPlayer.dll' work/payload-from-apk-list.txt
          grep -Fq 'StandaloneWindows64/' work/payload-from-apk-list.txt

          # Package-path safety after changing applicationId.
          rm -rf work/apk-unpacked
          mkdir -p work/apk-unpacked
          unzip -q "$APK" -d work/apk-unpacked
          python - <<'PY'
          from pathlib import Path
          old=b"/data/data/com.winlator"
          new=b"/data/data/com.magekana"
          root=Path("work/apk-unpacked")
          old_hits=[]
          new_hits=[]
          candidates=[root/"classes.dex"]
          candidates.extend((root/"lib").rglob("*"))
          for p in candidates:
              if not p.is_file() or p.is_symlink():
                  continue
              data=p.read_bytes()
              if old in data:
                  old_hits.append(str(p.relative_to(root)))
              n=data.count(new)
              if n:
                  new_hits.append((str(p.relative_to(root)),n))
          if old_hits:
              raise SystemExit("Old Winlator sandbox path remains: "+", ".join(old_hits))
          if not new_hits:
              raise SystemExit("No patched Mage sandbox path found")
          Path("work/compiled-package-paths.txt").write_text(
              "\n".join(f"{name}: {count}" for name,count in new_hits)+"\n"
          )
          PY

          mkdir -p dist
          cp "$APK" "dist/$FINAL_APK"
          sha256sum "dist/$FINAL_APK" | tee work/apk-sha256.txt
          stat -c 'APK_SIZE=%s' "dist/$FINAL_APK" | tee work/apk-size.txt

      - name: Upload QA
        uses: actions/upload-artifact@v4
        with:
          name: Mage-Kanade-Android-v1-QA
          path: |
            work/apk-badging.txt
            work/apk-signature.txt
            work/apk-zipalign.txt
            work/apk-zip-test.txt
            work/payload-list.txt
            work/payload-sha256.txt
            work/payload-size.txt
            work/payload-from-apk-list.txt
            work/package-path-patch.txt
            work/compiled-package-paths.txt
            work/apk-sha256.txt
            work/apk-size.txt
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='mage-kanade-android-v1'
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "dist/$FINAL_APK"             --repo "$GITHUB_REPOSITORY"             --title "Mage Kanade Dungeon Quest Android v1"             --notes "Dedicated Android compatibility port of the original Unity IL2CPP Windows build. Winlator 11.2 / Box64 / DXVK, embedded original game data, touch controls, package com.magekana."
