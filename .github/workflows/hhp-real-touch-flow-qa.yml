name: Happy Heart Panic Real Touch Flow QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hhp-real-touch-flow-qa.yml'

permissions:
  actions: read
  contents: read

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Download hardened v3 APK
        uses: actions/download-artifact@v4
        with:
          name: Happy-Heart-Panic-2025-Android-v3
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: harekuto/test
          run-id: 35531382485

      - name: Real touch agreement -> menu -> gameplay QA
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_PACKAGE: com.harekuto.happyheartpanic
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash happyheart/real_touch_flow_qa.sh

      - name: Upload real-flow QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Heart-Panic-v3-real-touch-flow-QA
          path: |
            agreement.png
            menu.png
            gameplay.png
            relaunch.png
            runtime.log
            relaunch.log
            touch-coordinates.txt
            screen-hashes.txt
            pid-agreement.txt
            pid-menu.txt
            pid-gameplay.txt
            pid-relaunch.txt
          if-no-files-found: ignore
          retention-days: 30
