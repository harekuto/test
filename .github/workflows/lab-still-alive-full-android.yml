name: LAB Still Alive Full Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-still-alive-full-android.yml'
      - 'labstillalive/patch_winlator.py'
      - 'labstillalive/patch_winlator_package_paths.py'

permissions:
  contents: read

concurrency:
  group: lab-still-alive-full-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools zip unzip zstd
          python -m pip install --disable-pip-version-check --no-input 'gdown==5.2.0'

      - name: Download and verify original LAB v1.25
        run: |
          set -euxo pipefail
          mkdir -p work/game
          gdown --fuzzy 'https://drive.google.com/file/d/16oZFmo20ScvtKu_QGq52UmQQ1a-efC87/view?usp=drivesdk' -O work/LAB-v1.25.rar
          test "$(stat -c%s work/LAB-v1.25.rar)" -eq 101930988
          echo '9f5a8b85b7d7d05792e88517b859b64bf7206a24e50041e788ff9c36bba0dd2a  work/LAB-v1.25.rar' | sha256sum -c -
          bsdtar -xf work/LAB-v1.25.rar -C work/game
          ROOT='work/game/LAB-Still Alive- Ver.1.25'
          test -f "$ROOT/LAB-Still Alive- Ver.1.25.exe"
          test "$(stat -c%s "$ROOT/LAB-Still Alive- Ver.1.25.exe")" -eq 978944
          test "$(stat -c%s "$ROOT/LAB-Still Alive- Ver.1.25.actbin")" -eq 36982944
          test "$(stat -c%s "$ROOT/LAB-Still Alive- Ver.1.25.actstr")" -eq 77116800
          test "$(stat -c%s "$ROOT/LAB-Still Alive- Ver.1.25.ini")" -eq 687

      - name: Create deterministic in-APK game payload
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/work/game/LAB-Still Alive- Ver.1.25"
          mkdir -p work/payload
          cp "$ROOT/LAB-Still Alive- Ver.1.25.exe" work/payload/
          cp "$ROOT/LAB-Still Alive- Ver.1.25.actbin" work/payload/
          cp "$ROOT/LAB-Still Alive- Ver.1.25.actstr" work/payload/
          cp "$ROOT/LAB-Still Alive- Ver.1.25.ini" work/payload/
          cp "$ROOT/_memory1.actsave" work/payload/ 2>/dev/null || true
          (
            cd work/payload
            zip -0 -q -X -r ../lab_payload.zip .
          )
          unzip -t work/lab_payload.zip
          unzip -l work/lab_payload.zip | tee work/payload-list.txt
          sha256sum work/lab_payload.zip | tee work/payload-sha256.txt

      - name: Checkout pinned Winlator 11.2 runtime
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/brunodev85/winlator-app.git winlator
          cd winlator
          git checkout a030f552f452158a2db64fdb32b490fa19c0b48d

      - name: Patch dedicated LAB launcher and inject original game
        run: |
          set -euxo pipefail
          python labstillalive/patch_winlator.py winlator
          python labstillalive/patch_winlator_package_paths.py winlator | tee work/package-path-patch.txt
          test -f winlator/app/src/main/java/com/winlator/LabStillAliveBootstrap.java
          test -f winlator/app/src/main/assets/inputcontrols/profiles/controls-99.icp
          mkdir -p winlator/app/src/main/assets
          cp work/lab_payload.zip winlator/app/src/main/assets/lab_payload.zip
          cp work/payload-sha256.txt winlator/app/src/main/assets/lab_payload_sha256.txt
          python - <<'PY'
          from pathlib import Path
          p=Path("winlator/app/build.gradle")
          s=p.read_text()
          anchor="    compileSdk 35\n"
          if anchor not in s:
              raise SystemExit("android build.gradle anchor missing")
          s=s.replace(anchor, anchor+"\n    androidResources {\n        noCompress += ['zip']\n    }\n", 1)
          p.write_text(s)
          PY
          grep -n "applicationId 'com.harekuto'" winlator/app/build.gradle
          grep -n "noCompress" winlator/app/build.gradle
          grep -n "LabStillAliveBootstrap.startWhenReady" winlator/app/src/main/java/com/winlator/MainActivity.java

      - name: Install Android build dependencies
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;24.0.8215888"             "cmake;3.22.1"

      - name: Build full dedicated APK
        working-directory: winlator
        run: |
          set -euxo pipefail
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew --no-daemon clean :app:assembleDebug

      - name: Deep verify APK, embedded payload and signature
        run: |
          set -euxo pipefail
          APK="$(find winlator/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$AAPT" dump badging "$APK" | tee work/apk-badging.txt
          grep -q "package: name='com.harekuto'" work/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee work/apk-signature.txt
          "$ZIPALIGN" -c -p 4 "$APK" | tee work/apk-zipalign.txt
          unzip -t "$APK" | tee work/apk-zip-test.txt
          unzip -l "$APK" | tee work/apk-list.txt
          grep -q 'assets/lab_payload.zip' work/apk-list.txt
          grep -q 'assets/inputcontrols/profiles/controls-99.icp' work/apk-list.txt

          unzip -p "$APK" assets/lab_payload.zip > work/payload-from-apk.zip
          cmp work/lab_payload.zip work/payload-from-apk.zip
          unzip -l work/payload-from-apk.zip | tee work/payload-from-apk-list.txt
          grep -Fq 'LAB-Still Alive- Ver.1.25.exe' work/payload-from-apk-list.txt
          grep -Fq 'LAB-Still Alive- Ver.1.25.actbin' work/payload-from-apk-list.txt
          grep -Fq 'LAB-Still Alive- Ver.1.25.actstr' work/payload-from-apk-list.txt

          # The original Winlator binaries/assets were built with an absolute
          # /data/data/com.winlator path. Shipping any such path under our
          # applicationId would make Wine/Box64 target another Android sandbox.
          rm -rf work/apk-unpacked
          mkdir -p work/apk-unpacked
          unzip -q "$APK" -d work/apk-unpacked

          python - <<'PY'
          from pathlib import Path
          old=b"/data/data/com.winlator"
          new=b"/data/data/com.harekuto"
          root=Path("work/apk-unpacked")
          old_hits=[]
          new_hits=[]
          candidates=[root/"classes.dex"]
          candidates.extend((root/"lib").rglob("*"))
          for p in candidates:
              if not p.is_file() or p.is_symlink():
                  continue
              data=p.read_bytes()
              if old in data:
                  old_hits.append(str(p.relative_to(root)))
              n=data.count(new)
              if n:
                  new_hits.append((str(p.relative_to(root)),n))
          if old_hits:
              raise SystemExit("Old Winlator sandbox path remains in compiled APK: "+", ".join(old_hits))
          Path("work/compiled-package-paths.txt").write_text(
              "\n".join(f"{name}: {count}" for name,count in new_hits)+"\n"
          )
          if not new_hits:
              raise SystemExit("Compiled APK contains no patched LAB sandbox path")
          PY

          rm -rf work/package-asset-audit
          mkdir -p work/package-asset-audit
          for ASSET in             rootfs.tzst             rootfs_patches.tzst             box64/box64-0.4.4.tzst             graphics_driver/gladio-1.1.tzst             container_pattern.tzst; do
            SAFE_NAME="$(echo "$ASSET" | tr '/' '_')"
            mkdir -p "work/package-asset-audit/$SAFE_NAME"
            unzip -p "$APK" "assets/$ASSET" > "work/package-asset-audit/$SAFE_NAME.tzst"
            tar --zstd -xf "work/package-asset-audit/$SAFE_NAME.tzst" -C "work/package-asset-audit/$SAFE_NAME"
          done

          python - <<'PY'
          from pathlib import Path
          import os
          old=b"/data/data/com.winlator"
          new=b"/data/data/com.harekuto"
          old_text=old.decode()
          new_text=new.decode()
          base=Path("work/package-asset-audit")
          lines=[]
          old_hits=[]
          new_total=0
          for root in sorted(p for p in base.iterdir() if p.is_dir()):
              byte_hits=0
              link_hits=0
              for current, dirs, files in os.walk(root, followlinks=False):
                  cp=Path(current)
                  for name in list(dirs):
                      p=cp/name
                      if p.is_symlink():
                          target=os.readlink(p)
                          if old_text in target: old_hits.append(f"{root.name}:{p.relative_to(root)} -> {target}")
                          link_hits += target.count(new_text)
                          dirs.remove(name)
                  for name in files:
                      p=cp/name
                      if p.is_symlink():
                          target=os.readlink(p)
                          if old_text in target: old_hits.append(f"{root.name}:{p.relative_to(root)} -> {target}")
                          link_hits += target.count(new_text)
                          continue
                      data=p.read_bytes()
                      if old in data: old_hits.append(f"{root.name}:{p.relative_to(root)}")
                      byte_hits += data.count(new)
              lines.append(f"{root.name}: bytes={byte_hits} symlinks={link_hits}")
              new_total += byte_hits + link_hits
          if old_hits:
              raise SystemExit("Old sandbox path remains in embedded runtime assets: "+", ".join(old_hits[:20]))
          if new_total < 450:
              raise SystemExit(f"Embedded runtime sandbox-path audit unexpectedly low: {new_total}")
          Path("work/rootfs-package-paths.txt").write_text("\n".join(lines)+"\n")
          PY

          mkdir -p dist
          FINAL='dist/LAB-Still-Alive-v1.25-Android-FULL.apk'
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" | tee work/apk-sha256.txt
          stat -c 'APK_SIZE=%s' "$FINAL" | tee work/apk-size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-Still-Alive-v1.25-Android-FULL
          path: dist/LAB-Still-Alive-v1.25-Android-FULL.apk
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-Still-Alive-v1.25-Android-FULL-QA
          path: |
            work/apk-badging.txt
            work/apk-signature.txt
            work/apk-zipalign.txt
            work/apk-zip-test.txt
            work/apk-list.txt
            work/payload-list.txt
            work/payload-sha256.txt
            work/payload-from-apk-list.txt
            work/apk-sha256.txt
            work/apk-size.txt
            work/package-path-patch.txt
            work/compiled-package-paths.txt
            work/rootfs-package-paths.txt
          retention-days: 30
