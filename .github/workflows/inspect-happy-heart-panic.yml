name: Inspect Happy Heart Panic Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-happy-heart-panic.yml'
      - 'happyheart/inspect_game.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction tools
        run: |
          python -m pip install --upgrade gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file
      - name: Download original Drive archive
        run: |
          mkdir -p work report
          gdown 'https://drive.google.com/uc?id=1Iy5ZMgEM_JP7wxeSNySKD4fdxz3dWo3e' -O work/game.rar
          test -s work/game.rar
          file work/game.rar
          sha256sum work/game.rar
      - name: Inspect game
        run: |
          python happyheart/inspect_game.py work/game.rar report | tee report/console.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: happy-heart-panic-inspection
          path: report/
          retention-days: 7
