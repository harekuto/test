name: EchoTranscript Android APK
on:
  push:
    branches: [echo-transcript-android]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'build.gradle'
      - '.github/workflows/echo-transcript-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoTranscript-1.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
