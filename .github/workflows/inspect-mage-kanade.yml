name: Inspect Mage Kanade Game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mage-kanade.yml'
      - 'magekanade/inspect.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file
      - name: Download source from Drive
        run: |
          mkdir -p work report
          gdown 'https://drive.google.com/uc?id=1QBrS8TcO7KA7eMqRHqcnL2AyeMCQtZ3N' -O work/game.7z
          test -s work/game.7z
          file work/game.7z
          sha256sum work/game.7z
      - name: Inspect
        run: |
          python magekanade/inspect.py work/game.7z report | tee report/console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mage-kanade-inspection
          path: report/
          retention-days: 7
