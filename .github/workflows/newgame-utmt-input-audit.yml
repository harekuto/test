name: New Game UTMT Input Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/newgame-utmt-input-audit.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download game and UTMT CLI
        run: |
          python -m pip install gdown
          mkdir -p work/game work/utmt
          gdown 1P5tBahadA9hu2EH21632YGrFC25ewFaN -O work/game.zip
          7z x -y work/game.zip -owork/game >/dev/null
          curl -L --fail --retry 3             https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip             -o work/utmt.zip
          unzip -q work/utmt.zip -d work/utmt
          chmod +x work/utmt/UndertaleModCli 2>/dev/null || true
          find work/utmt -maxdepth 2 -type f | head -40
          find work/game -type f -iname '*.win' -print

      - name: Detect GameMaker version
        run: |
          WINFILE="$(find work/game -type f -iname '*.win' | head -1)"
          test -n "$WINFILE"
          echo "WINFILE=$WINFILE" | tee work/version.txt
          work/utmt/UndertaleModCli info "$WINFILE" -v 2>&1 | tee -a work/version.txt

      - name: Decompile all GML
        run: |
          WINFILE="$(find work/game -type f -iname '*.win' | head -1)"
          mkdir -p work/decomp
          work/utmt/UndertaleModCli dump "$WINFILE" -c UMT_DUMP_ALL -o work/decomp -v 2>&1 | tee work/dump.log
          find work/decomp -type f | wc -l
          du -sh work/decomp

      - name: Analyze controls and compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections, json

          root=Path('work/decomp')
          files=[p for p in root.rglob('*') if p.is_file()]
          textfiles=[]
          for p in files:
              try:
                  s=p.read_text('utf-8-sig',errors='replace')
                  textfiles.append((p,s))
              except: pass

          report=[]
          pats=[
            r'keyboard_check(?:_pressed|_released)?\s*\([^\)]*\)',
            r'keyboard_key(?:_press|_release)?\s*\([^\)]*\)',
            r'gamepad_[A-Za-z0-9_]+\s*\([^\)]*\)',
            r'mouse_check_button(?:_pressed|_released)?\s*\([^\)]*\)',
            r'device_mouse_[A-Za-z0-9_]+\s*\([^\)]*\)',
          ]
          calls=collections.Counter()
          callfiles=collections.defaultdict(list)
          for p,s in textfiles:
              for pat in pats:
                  for m in re.finditer(pat,s,re.I):
                      val=' '.join(m.group(0).split())
                      calls[val]+=1
                      if len(callfiles[val])<12:
                          callfiles[val].append(str(p.relative_to(root)))
          report.append('=== INPUT CALLS ===')
          for call,n in calls.most_common():
              report.append(f'{n:4d} {call}')
              for f in callfiles[call]:
                  report.append('      '+f)

          constants=collections.Counter()
          for p,s in textfiles:
              for m in re.finditer(r'\b(vk_[a-z0-9_]+|gp_[a-z0-9_]+|mb_(?:left|right|middle|any|none|side1|side2))\b',s,re.I):
                  constants[m.group(1)]+=1
          report.append('\n=== INPUT CONSTANTS ===')
          for k,n in constants.most_common(): report.append(f'{n:4d} {k}')

          ords=collections.Counter()
          for p,s in textfiles:
              for m in re.finditer(r'ord\s*\(\s*["\'](.{1,3}?)["\']\s*\)',s,re.I):
                  ords[m.group(1)]+=1
          report.append('\n=== ORD KEYS ===')
          for k,n in ords.most_common(): report.append(f'{n:4d} ord({k!r})')

          # Window/display/GUI scaling and mobile/platform branches
          report.append('\n=== DISPLAY / PLATFORM HITS ===')
          look=[
            r'display_get_[A-Za-z0-9_]+\s*\([^\)]*\)',
            r'window_[A-Za-z0-9_]+\s*\([^\)]*\)',
            r'display_set_[A-Za-z0-9_]+\s*\([^\)]*\)',
            r'draw_set_gui_(?:size|maximise)\s*\([^\)]*\)',
            r'os_type\s*(?:==|!=|=)[^\n;]*',
            r'os_android',
            r'device_mouse_[A-Za-z0-9_]+',
          ]
          hits=[]
          for p,s in textfiles:
              for pat in look:
                  for m in re.finditer(pat,s,re.I):
                      v=' '.join(m.group(0).split())
                      hits.append((str(p.relative_to(root)),v))
          for f,v in hits[:1200]: report.append(f'{f}: {v}')

          # extensions / DLL calls surfaced in code
          report.append('\n=== NATIVE/FILE/PROCESS RISK ===')
          riskpats=[r'external_define\s*\([^\)]*\)',r'dll',r'execute_shell',r'file_[A-Za-z0-9_]+\s*\(',r'environment_get_variable',r'working_directory',r'program_directory']
          for p,s in textfiles:
              found=[]
              for pat in riskpats:
                  if re.search(pat,s,re.I): found.append(pat)
              if found:
                  report.append(str(p.relative_to(root))+' :: '+','.join(found))

          Path('work/controls.txt').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report[:500]))
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: newgame-utmt-input-audit
          path: |
            work/version.txt
            work/controls.txt
            work/dump.log
          retention-days: 7
