name: Audit Mage Kanade Unity Runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mage-kanade-unity.yml'
      - 'magekanade/audit_unity.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full binutils file
      - name: Download source
        run: |
          mkdir -p work report
          gdown 'https://drive.google.com/uc?id=1QBrS8TcO7KA7eMqRHqcnL2AyeMCQtZ3N' -O work/game.7z
          echo '76503aeaf02387cea3a509dbc881eb06abb1b751376395c5cc6443482770989c  work/game.7z' | sha256sum -c -
      - name: Audit Unity
        run: |
          python magekanade/audit_unity.py work/game.7z report | tee report/console.txt
          rm -rf report/tmp
      - uses: actions/upload-artifact@v4
        with:
          name: mage-kanade-unity-audit
          path: report/
          retention-days: 7
