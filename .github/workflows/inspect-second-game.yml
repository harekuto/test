name: Inspect Second Windows Game for Android Port
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-second-game.yml'
      - 'port2/inspect_game.py'
permissions:
  contents: read
env:
  DRIVE_URL: https://drive.google.com/file/d/1P5tBahadA9hu2EH21632YGrFC25ewFaN/view?usp=drivesdk
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full file
      - name: Download original game
        run: |
          mkdir -p work report
          gdown "$DRIVE_URL" -O work/game.bin
          test -s work/game.bin
          stat -c 'bytes=%s' work/game.bin
          sha256sum work/game.bin
      - name: Inspect safely
        run: |
          python port2/inspect_game.py work/game.bin report | tee report/console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: second-game-inspection
          path: report/
          retention-days: 7
