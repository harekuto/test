name: Build Super Monsters n Girls Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-second-game-android.yml'
      - 'port2/PortCli.Program.cs'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  DRIVE_URL: https://drive.google.com/file/d/1P5tBahadA9hu2EH21632YGrFC25ewFaN/view?usp=drivesdk
  MOBILER_REPO: https://github.com/znm2500/GameMaker-Mobiler.git
  MOBILER_COMMIT: 6a23adc1d4e71c238456568df18f85cc7b44caa9
  APK_NAME: Super-Monsters-n-Girls-2.0.2-Android-v1.apk
  RELEASE_TAG: super-monsters-ngirls-android-v1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install download helper
        shell: pwsh
        run: python -m pip install --upgrade gdown

      - name: Download and validate original Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work, release, report | Out-Null
          gdown "$env:DRIVE_URL" -O work/game.zip
          if (!(Test-Path work/game.zip)) { throw "Download failed" }
          $hash=(Get-FileHash work/game.zip -Algorithm SHA256).Hash.ToLower()
          $size=(Get-Item work/game.zip).Length
          "input_sha256=$hash" | Tee-Object report/input.txt
          "input_bytes=$size" | Tee-Object -Append report/input.txt
          if ($hash -ne "4a221f87a95633bd835b348e1b7f4e6e5c89376bc8e286b6ae55159f533344f0") { throw "Original ZIP hash changed" }
          Expand-Archive -LiteralPath work/game.zip -DestinationPath work/game -Force
          $data=Get-ChildItem work/game -Recurse -Filter data.win | Select-Object -First 1
          if ($null -eq $data) { throw "data.win missing" }
          "data_win=$($data.FullName)" | Tee-Object -Append report/input.txt

      - name: Clone pinned GameMaker Android port toolchain
        shell: pwsh
        run: |
          git clone "$env:MOBILER_REPO" mobiler
          Set-Location mobiler
          git checkout --detach "$env:MOBILER_COMMIT"
          Remove-Item NuGet.config -Force -ErrorAction SilentlyContinue
          Set-Location ..
          if (!(Test-Path "mobiler/GMS2 APK/2.2.2.apk")) { throw "Exact 2.2.2 runner template missing" }

      - name: Patch upstream mobile scripts for GameMaker 2.2
        shell: pwsh
        run: |
          $root="mobiler/Tools/移植脚本/安卓脚本v2.0/MobileScript"
          Get-ChildItem $root -Recurse -Filter *.gml | ForEach-Object {
            $s=Get-Content $_.FullName -Raw
            $s=$s.Replace('draw_get_font()','-1')
            $s=$s.Replace('draw_get_halign()','fa_left')
            $s=$s.Replace('draw_get_valign()','fa_top')
            $s=$s.Replace('draw_get_alpha()','1')
            $s=$s.Replace('draw_get_color()','c_white')
            Set-Content $_.FullName $s -Encoding UTF8
          }
          $bad=Get-ChildItem $root -Recurse -Filter *.gml | Select-String -Pattern 'draw_get_(font|halign|valign|alpha|color)'
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; throw "Unsupported draw_get function remained" }

      - name: Build game-specific port CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mobiler/PortCli | Out-Null
          Copy-Item port2/PortCli.Program.cs mobiler/PortCli/Program.cs
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0-windows7.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../GameMaker-Mobiler/GameMaker-Mobiler.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content mobiler/PortCli/PortCli.csproj -Encoding UTF8
          dotnet build mobiler/PortCli/PortCli.csproj -c Release --nologo

      - name: Patch data.win and build Android APK
        shell: pwsh
        run: |
          $data=(Get-ChildItem work/game -Recurse -Filter data.win | Select-Object -First 1).FullName
          $gameDir=Split-Path -Parent $data
          $apk=(Join-Path $PWD "release/$env:APK_NAME")
          dotnet run --project mobiler/PortCli/PortCli.csproj -c Release --no-build -- "$data" "$gameDir" "$apk" 2>&1 | Tee-Object report/port-build.log
          if ($LASTEXITCODE -ne 0) { throw "Port CLI failed" }
          if (!(Test-Path $apk)) { throw "APK missing" }

      - name: Install Android verification tools
        shell: pwsh
        run: |
          $sdkmanager=Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
          & $sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Deep verify APK
        shell: pwsh
        run: |
          $apk=Join-Path $PWD "release/$env:APK_NAME"
          $aapt=Join-Path $env:ANDROID_HOME "build-tools/36.0.0/aapt.exe"
          $signer=Join-Path $env:ANDROID_HOME "build-tools/36.0.0/apksigner.bat"
          & $signer verify --verbose --print-certs "$apk" 2>&1 | Tee-Object report/apksigner.txt
          if ($LASTEXITCODE -ne 0) { throw "APK signature invalid" }
          & $aapt dump badging "$apk" 2>&1 | Tee-Object report/aapt-badging.txt
          if ($LASTEXITCODE -ne 0) { throw "aapt failed" }
          $sha=(Get-FileHash "$apk" -Algorithm SHA256).Hash.ToLower()
          $size=(Get-Item "$apk").Length
          "apk_sha256=$sha" | Tee-Object report/apk.txt
          "apk_bytes=$size" | Tee-Object -Append report/apk.txt
          7z t "$apk" | Tee-Object report/7z-test.txt
          if ($LASTEXITCODE -ne 0) { throw "APK ZIP integrity failed" }
          7z l "$apk" | Tee-Object report/apk-files.txt
          $listing=Get-Content report/apk-files.txt -Raw
          if ($listing -notmatch "assets[\\/]game\.droid") { throw "game.droid missing" }
          foreach($n in 1..3) { if ($listing -notmatch "audiogroup$n\.dat") { throw "audiogroup$n.dat missing" } }
          $badging=Get-Content report/aapt-badging.txt -Raw
          if ($badging -notmatch "com\.harekuto\.supermonstersngirls") { throw "Package ID mismatch" }
          if ($badging -notmatch "2\.0\.2-android-v1") { throw "Version mismatch" }

      - name: Inspect native ABI
        shell: pwsh
        run: |
          (Get-Content report/apk-files.txt | Select-String -Pattern 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/.*\.so') | Set-Content report/native-abi.txt
          Get-Content report/native-abi.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Monsters-n-Girls-Android-v1-APK
          path: release/\${{ env.APK_NAME }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Super-Monsters-n-Girls-Android-v1-diagnostics
          path: report/
          retention-days: 7
          if-no-files-found: warn

      - name: Publish GitHub release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "Super Monsters'n Girls Android v1" --notes "GameMaker 2.2.2.302 Android port using exact 2.2.2 runner. Tailored multitouch HUD: D-pad, Jump(X), Attack(C), Menu(Enter), Back(Escape), Mode(Space), Language(Ctrl+Insert). Original keyboard and gamepad logic preserved."
          }
          gh release upload "$env:RELEASE_TAG" "release/$env:APK_NAME" --clobber
