name: LAB Native Playable Player Prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-native-player-prototype.yml'
      - 'labnative/player_prototype.csx'
      - 'labnative/extract_player_assets.py'
      - 'labnative/player_smoke.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source, tools and donor
        run: |
          set -eux
          python3 -m pip install --upgrade gdown pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip zip openjdk-17-jdk
          mkdir -p work/game work/assets work/utmt work/pkg
          gdown 'https://drive.google.com/uc?id=16jP6BmHNz6oeKd_yNS5EhQh1r2isOhOf' -O work/LAB.rar
          7z x -y work/LAB.rar -owork/game >/dev/null
          ACTBIN="$(find work/game -type f -name 'LAB-Still Alive- Ver.1.25.actbin' -print -quit)"
          test -n "$ACTBIN"
          python3 labnative/extract_player_assets.py "$ACTBIN" work/assets
          test -s work/assets/wall_008.png

          curl -L --fail --retry 3             'https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip'             -o work/utmt.zip
          unzip -q work/utmt.zip -d work/utmt
          UTMT="$(find work/utmt -type f \( -name 'UndertaleModCli' -o -name 'UndertaleModCLI' \) -print -quit)"
          chmod +x "$UTMT"
          echo "UTMT=$UTMT" >> "$GITHUB_ENV"

          curl -L --fail --retry 3             'https://github.com/harekuto/test/releases/download/happy-heart-panic-android-v5/Happy-Heart-Panic-2025-Android-v5.apk'             -o work/donor.apk
          unzip -p work/donor.apk assets/game.droid > work/donor.droid
          test -s work/donor.droid

      - name: Build native player data
        run: |
          set -eux
          "$UTMT" load work/donor.droid -s labnative/player_prototype.csx -o work/game.droid -f -v | tee work/import.txt
          "$UTMT" info work/game.droid -v | tee work/game-info.txt
          rm -rf work/dump
          "$UTMT" dump work/game.droid -c UMT_DUMP_ALL -o work/dump >/dev/null
          grep -R -n 'LAB_NATIVE_PLAYER_OK' work/dump | tee work/proof.txt
          test -s work/proof.txt

      - name: Package native playable APK
        run: |
          set -eux
          cp work/donor.apk work/pkg/u.apk
          zip -q -d work/pkg/u.apk 'META-INF/*' || true
          mkdir -p work/pkg/assets
          cp work/game.droid work/pkg/assets/game.droid
          cp work/assets/wall_008.png work/pkg/assets/wall_008.png
          cp work/assets/wall_009.png work/pkg/assets/wall_009.png
          (
            cd work/pkg
            zip -q -0 -u u.apk assets/game.droid assets/wall_008.png assets/wall_009.png
          )

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 work/pkg/u.apk work/pkg/a.apk
          keytool -genkeypair -v             -keystore work/pkg/debug.keystore             -storepass android -alias androiddebugkey -keypass android             -dname 'CN=LAB Native Player,O=Harekuto,C=KZ'             -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          "$BUILD_TOOLS/apksigner" sign             --ks work/pkg/debug.keystore --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out work/LAB-Native-Player-Prototype.apk work/pkg/a.apk
          "$BUILD_TOOLS/apksigner" verify --verbose work/LAB-Native-Player-Prototype.apk
          "$BUILD_TOOLS/aapt" dump badging work/LAB-Native-Player-Prototype.apk > work/badging.txt
          PKG="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" work/badging.txt | head -1)"
          test -n "$PKG"
          echo "$PKG" > work/package.txt
          sha256sum work/LAB-Native-Player-Prototype.apk | tee work/apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAB-Native-Player-Prototype
          path: |
            work/LAB-Native-Player-Prototype.apk
            work/package.txt
            work/game-info.txt
            work/proof.txt
            work/player-atlas-metadata.json
            work/apk-sha256.txt
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LAB-Native-Player-Prototype
          path: artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android player smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash labnative/player_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-Native-Player-Prototype-Smoke
          path: |
            player-pid.txt
            player-pid-after.txt
            player-start.png
            player-after-input.png
            player-log.txt
          if-no-files-found: ignore
          retention-days: 30
